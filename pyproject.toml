[project]
name = "leadgen"
version = "0.1.0"
description = "Automatické vyhledávání firem, AI volání přes Vapi a reporty pro Freeheating"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1",
    "apscheduler>=3.10,<4",
    "fastapi>=0.110",
    "holidays>=0.50",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leadgen = "leadgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leadgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
